name: Build all targets
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: ./dependencies/linux.sh
      - uses: jurplel/install-qt-action@v4
        if: runner.os != 'Linux'
        with:
          version: '6.8.3'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build
        shell: bash
        run: ./scripts/build -t desktop
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          ./scripts/package -t deb -b build_desktop
          ./scripts/package -t sh -b build_desktop
      - name: Deploy Windows
        if: runner.os == 'Windows'
        shell: bash
        run: windeployqt --release build_desktop/Release/LocalClipboard.exe
      - name: Deploy macOS
        if: runner.os == 'macOS'
        run: macdeployqt build_desktop/LocalClipboard.app -dmg
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*
            build_desktop/Release/
            build_desktop/*.dmg
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # The legacy 'tools' package is no longer served by Google.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK and NDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          cache: true
      - name: Build Qt APK
        shell: bash
        run: |
          export QT_HOST_PATH="$QT_ROOT_DIR"
          export QT_ANDROID_ROOT="$(dirname "$QT_ROOT_DIR")/android_arm64_v8a"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          ./scripts/build -t android -c Debug
          ./scripts/package -t apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: dist/*.apk
