name: Build five packages and five installers
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: ./dependencies/linux.sh
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
      - uses: jurplel/install-qt-action@v4
        if: runner.os != 'Linux'
        with:
          version: '6.11.2'
          modules: 'qtmultimedia'
          setup-python: ${{ runner.os != 'Windows' }}
          # Released aqt 3.3.0 cannot read Windows Qt 6.11's per-architecture
          # repositories. Pin upstream's fix (aqtinstall PR #1000).
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b' || '' }}
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Windows installer tools
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Build application, package and installer
        shell: bash
        run: ./scripts/build -t desktop
      - name: Test profiles, encryption and clipboard transfer
        shell: bash
        run: |
          cmake --build build_desktop --config Release --parallel 4 --target clipboard_tests app_tests
          ctest --test-dir build_desktop -C Release --output-on-failure
      - name: Test Android interface layouts, translation and scrolling
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build_mobile_ui -DCMAKE_BUILD_TYPE=Release -DLOCALCLIPBOARD_MOBILE_PREVIEW=ON
          cmake --build build_mobile_ui --parallel 4 --target mobile_tests
          ctest --test-dir build_mobile_ui -R mobile_interface --output-on-failure
      - name: Save test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ runner.os }}
          if-no-files-found: ignore
          path: build_desktop/Testing/Temporary/*.log
      - name: Test installer arguments and removal guards
        if: runner.os != 'Windows'
        run: python3 tests/PackagingTests.py
      - name: Check PowerShell installer scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem packaging/android/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LocalClipboard-${{ runner.os }}
          if-no-files-found: error
          path: dist/LocalClipboard-*
  android:
    runs-on: ubuntu-22.04
    concurrency:
      group: android-signing-${{ github.ref }}
      cancel-in-progress: false
    env:
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK and NDK
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Restore Android development signing key
        if: env.ANDROID_DEBUG_KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: localclipboard-android-debug-signing-v1
      - name: Prepare persistent Android development signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [[ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          elif [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=LocalClipboard Development,O=LocalClipboard,C=US'
            echo '::warning::Created a new development signing key. Back it up in ANDROID_DEBUG_KEYSTORE_BASE64 for updates that survive cache eviction.'
          fi
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          target: android
          arch: android_arm64_v8a
          cache: true
      - name: Build APK and installer
        shell: bash
        run: |
          export QT_ANDROID_ROOT="$QT_ROOT_DIR"
          : "${QT_HOST_PATH:?Qt installer did not provide the desktop host kit}"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          ./scripts/build -t android -c Debug
      - name: Verify APK signature and 16 KiB compatibility
        shell: bash
        run: |
          python3 scripts/verify-android-apk dist/LocalClipboard-android-package.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose dist/LocalClipboard-android-package.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 4 dist/LocalClipboard-android-package.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LocalClipboard-Android
          if-no-files-found: error
          path: dist/LocalClipboard-android-*
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtmultimedia'
          target: ios
          arch: ios
          cache: true
      - name: Build iPhone application and Xcode installer
        shell: bash
        run: |
          export QT_IOS_ROOT="$QT_ROOT_DIR"
          : "${QT_HOST_PATH:?Qt installer did not provide the matching macOS host kit}"
          ./scripts/build -t ios
      - uses: actions/upload-artifact@v4
        with:
          name: LocalClipboard-iOS
          if-no-files-found: error
          path: dist/LocalClipboard-ios-*
  distribution:
    needs: [desktop, android, ios]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LocalClipboard-*
          path: dist
          merge-multiple: true
      - name: Verify all ten outputs
        shell: bash
        run: |
          test "$(find dist -type f | wc -l)" -eq 10
          test -f dist/LocalClipboard-linux-amd64.deb
          test -f dist/LocalClipboard-linux-amd64-installer.sh
          test -f dist/LocalClipboard-macos-package.zip
          test -f dist/LocalClipboard-macos-installer.pkg
          test -f dist/LocalClipboard-windows-package.zip
          test -f dist/LocalClipboard-windows-installer.exe
          test -f dist/LocalClipboard-android-package.apk
          test -f dist/LocalClipboard-android-installer.zip
          test -f dist/LocalClipboard-ios-package.zip
          test -f dist/LocalClipboard-ios-installer.zip
          (cd dist && sha256sum LocalClipboard-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: LocalClipboard-all-platforms
          path: dist/*
          if-no-files-found: error
